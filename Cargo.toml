[package]
name = "telera-app"
version = "0.4.0"
edition = "2024"

[dependencies]
telera_macros = { path = "telera_macros" }
telera-layout = { path = "../telera-layout"}
winit = "0.30.12"
wgpu = "30.0.1"
pollster = "1.0.1"
image = "0.25.10"
bytemuck = { version = "1.25", features = [ "derive" ] }
cosmic-text = "0.19.0"
etagere = "0.3.0"
unicode-script = "0.5.8"
lyon = "1.0.19"
cgmath = "0.18.0"
anyhow = "1.0.104"
gltf = "1.4.1"
notify = "8.2.0"
bimap = "0.6.3"
rkyv = "0.8.18"
markdown = "1.0.0"
symbol_table = { version = "0.5.0", features = [ "global" ] }

# Line tables in optimized builds so `samply` / `cargo flamegraph` can name
# frames (applies to the whole graph: telera-layout, wgpu, lyon, glyphon, ...).
# ~10-15% larger binary, no runtime cost. See the Profiling section in readme.md.
[profile.release]
debug = "line-tables-only"
